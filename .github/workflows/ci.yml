name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: node --check plugin.js
      - run: bash -n scripts/run-dev-smoke.sh
      - run: npm run package
      - run: python3 -m unittest discover -s test -p package_plugin_test.py
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: decaid-e64ws-plugin-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error

  playwright:
    name: Playwright browser contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e64-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error

  host-compat:
    name: Decaid host compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: decentespresso/decaid
          ref: af4e99524ad7731dbdb7db4540cd272bc91da038
          path: decaid
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Stage package for the pinned host resolver
        env:
          PLUGIN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLUGIN_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          mkdir -p /tmp/e64-local-package /tmp/e64-github-package
          npm ci
          npm run package
          unzip -q dist/*.zip -d /tmp/e64-local-package
          curl --fail --location --retry 3 \
            "https://github.com/${PLUGIN_REPO}/archive/${PLUGIN_SHA}.tar.gz" \
            --output /tmp/e64-github.tar.gz
          tar -xzf /tmp/e64-github.tar.gz -C /tmp/e64-github-package
          echo "E64_GITHUB_PACKAGE=/tmp/e64-github-package" >> "$GITHUB_ENV"
          cp ci/host_manifest_compat_test.dart decaid/test/e64_external_manifest_compat_test.dart
          cp ci/host_runtime_test.dart decaid/test/plugins/e64_external_runtime_test.dart
      - name: Run pinned host parser and package resolver
        working-directory: decaid
        env:
          E64_PACKAGE: ${{ github.workspace }}
          E64_PLUGIN_ROOT: ${{ github.workspace }}
          E64_LOCAL_PACKAGE: /tmp/e64-local-package
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flutter pub get
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
          ./scripts/fetch_dcamp_plugin.sh
          mkdir -p assets/bundled_skins
          printf '["stub-skin"]\n' > assets/bundled_skins/manifest.json
          : > assets/bundled_skins/stub-skin.zip
          QUICKJS_LIB_DIR=$(find "${PUB_CACHE:-$HOME/.pub-cache}/git" -path '*dart_js*/linux/shared' -type d -print -quit)
          test -n "$QUICKJS_LIB_DIR"
          export LD_LIBRARY_PATH="$QUICKJS_LIB_DIR:${LD_LIBRARY_PATH:-}"
          flutter test test/e64_external_manifest_compat_test.dart test/plugins/e64_external_runtime_test.dart test/plugins/plugin_manager_transport_test.dart test/plugins/plugin_manager_transport_tls_test.dart test/plugins/plugin_manager_permissions_test.dart
          flutter test test/plugin_loader_service_appstore_test.dart --plain-name secure
          flutter test test/services/account/encrypted_credential_store_test.dart

  linux-runtime:
    name: Linux app and E64 mock smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: decentespresso/decaid
          ref: af4e99524ad7731dbdb7db4540cd272bc91da038
          path: decaid
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Linux runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev xvfb jq
      - name: Prepare pinned host and build Linux app
        working-directory: decaid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/fetch_dye2_plugin.sh
          ./scripts/fetch_shot_upload_plugin.sh
          ./scripts/fetch_dcamp_plugin.sh
          mkdir -p assets/bundled_skins
          printf '["stub-skin"]\n' > assets/bundled_skins/manifest.json
          : > assets/bundled_skins/stub-skin.zip
          # The app runtime smoke is loopback-only; this patch exists only in the CI clone.
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('lib/src/services/webserver_service.dart'), Path('lib/src/webui_support/webui_service.dart')]
          changed = 0
          for path in files:
              text = path.read_text()
              count = text.count("'0.0.0.0'")
              if count == 0:
                  raise SystemExit(f'expected loopback patch target in {path}')
              path.write_text(text.replace("'0.0.0.0'", "'127.0.0.1'"))
              changed += count
          print(f'patched {changed} listener addresses to loopback')
          PY
          flutter pub get
          flutter build linux --debug --dart-define=simulate=machine,scale --no-pub
      - name: Run isolated app against two public-contract mock grinders
        working-directory: decaid
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/e64-xdg/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/e64-xdg/config
          XDG_CACHE_HOME: ${{ runner.temp }}/e64-xdg/cache
          XDG_STATE_HOME: ${{ runner.temp }}/e64-xdg/state
          PLUGIN_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          # The ordinary installer resolves commit refs as well as branch names.
          PLUGIN_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          PLUGIN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
          node ../tools/e64-mock-server.mjs --id one --port 9997 --token token-one > "$RUNNER_TEMP/e64-one.log" 2>&1 & echo $! > "$RUNNER_TEMP/e64-one.pid"
          node ../tools/e64-mock-server.mjs --id two --port 9998 --token token-two > "$RUNNER_TEMP/e64-two.log" 2>&1 & echo $! > "$RUNNER_TEMP/e64-two.pid"
          trap 'for pidfile in "$RUNNER_TEMP/e64-one.pid" "$RUNNER_TEMP/e64-two.pid" "$RUNNER_TEMP/e64-app.pid"; do test -f "$pidfile" && kill "$(cat "$pidfile")" 2>/dev/null || true; done' EXIT
          for port in 9997 9998; do
            ready=false
            for attempt in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$port/health"; then ready=true; break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              echo "mock $port failed to start" >&2
              cat "$RUNNER_TEMP/e64-one.log" "$RUNNER_TEMP/e64-two.log" >&2 || true
              exit 1
            fi
          done
          APP=./build/linux/x64/debug/bundle/decaid
          xvfb-run -a "$APP" --no-account --bypass-onboarding --serial > "$RUNNER_TEMP/e64-app.log" 2>&1 & echo $! > "$RUNNER_TEMP/e64-app.pid"
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8080/api/v1/plugins >/dev/null && break; sleep 1; done
          test "$(curl -fsS http://127.0.0.1:8080/api/v1/plugins | jq 'length')" -ge 0
          ../scripts/run-dev-smoke.sh
          if grep -Eq 'token-one|token-two|incorrect-fixture-token' "$RUNNER_TEMP/e64-app.log" "$RUNNER_TEMP/e64-one.log" "$RUNNER_TEMP/e64-two.log"; then
            echo 'Synthetic credential leaked into app or mock logs' >&2
            exit 1
          fi
      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e64-linux-runtime-logs
          path: ${{ runner.temp }}/e64-*.log
          if-no-files-found: ignore
