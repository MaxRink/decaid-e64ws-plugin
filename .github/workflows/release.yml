name: Release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/package-plugin.py --tag "$GITHUB_REF_NAME"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: decaid-e64ws-plugin-${{ github.sha }}
          path: dist
      - name: Verify and publish the tested archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import release_assets
          version = json.loads(pathlib.Path('manifest.json').read_text())['version']
          assert os.environ['GITHUB_REF_NAME'].removeprefix('v') == version
          # One archive per channel, each checked against the contents this tree
          # produces for it: entry set, integrity, manifest version, its own
          # PLUGIN_CHANNEL marker against its filename, and the single documented
          # manifest difference between the two channels. Raises instead of
          # publishing a partial set, so a release cannot attach one channel.
          entries = release_assets.verify(pathlib.Path('dist'), pathlib.Path('.'))
          pathlib.Path('release-notes.md').write_text(release_assets.release_notes(entries, version))
          for entry in entries:
              print(f"{entry['name']}: {entry['channel']} channel, {entry['size']} bytes, {entry['sha256']}")
          PY
          gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag \
            --title "Mahlkönig WebSocket grinders $GITHUB_REF_NAME" --notes-file release-notes.md
